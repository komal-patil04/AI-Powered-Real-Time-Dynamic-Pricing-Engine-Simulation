services:

  kafka:
    image: apache/kafka:latest

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,BROKER:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,BROKER://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,BROKER://kafka:29092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

  producer:
    build: .
    command: python src/kafka/producer.py
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - kafka
    restart: on-failure

  consumer:
    build: .
    command: python src/kafka/consumer.py
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - kafka
    restart: on-failure

  fastapi:
    build: .

    command: >
      uvicorn src.api.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"
    
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    
    depends_on:
      - kafka

  streamlit:
    build: .

    command: >
      streamlit run src/dashboard/app.py
      --server.port 8501

    ports:
      - "8501:8501"
    
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      
    depends_on:
      - fastapi